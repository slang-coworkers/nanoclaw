slang-common:
  description: "Slang compiler spine — identity, ABI invariants, repo layout."
  project: slang
  extends: base-common
  identity: container/spines/slang/identity/compiler-engineer.md
  invariants:
    - container/spines/slang/invariants/abi-stability.md
  context:
    - container/spines/slang/context/layout.md
  skills:
    - slang-build
    - slang-code-reader
    - slang-github
  workflows: []
  overlays:
    - critique-overlay
  mcpServers:
    deepwiki:
      type: http
      url: https://mcp.deepwiki.com/mcp
  bindings:
    repo: slang-github
    issues: slang-github
    ci: slang-github
    code: slang-code-reader
    doc: slang-code-reader
    test: slang-build
    critique: codex-critique

slang-reader:
  description: "Read-only Slang coworker — plan, investigate, review, research. Cannot edit code or create PRs."
  project: slang
  extends: slang-common
  workflows:
    - slang-plan

slang-writer:
  description: "Write-capable Slang coworker — plan + implement. Can edit code, write tests, create PRs."
  project: slang
  extends: slang-common
  skills:
    - slang-code-writer
    - slang-docs
  workflows:
    - slang-plan
    - slang-implement
  bindings:
    code: slang-code-writer
    test: slang-build
    doc: slang-docs

slang-maintainer:
  description: "Read-only Slang maintainer — recurring sweeps via /slang-maintain (daily report, release notes, issue prioritization, Slack review). No code changes."
  project: slang
  extends: slang-reader
  skills:
    - slang-maintainer-tools
  workflows:
    - slang-maintain

slang-triage:
  description: "Slang issue triage — read issue, research docs + code, classify severity/priority, report to parent, forward to fixer if actionable. Read-only."
  project: slang
  extends: slang-reader
  workflows:
    - triage-issue

slang-triage-buddy:
  description: "Slang issue triage with real-time buddy monitor. Codex watches and guides mid-triage."
  project: slang
  extends: slang-triage
  overlays:
    - buddy-monitor

slang-fixer-buddy:
  description: "Slang issue fixer with real-time buddy monitor. Codex watches and guides mid-fix."
  project: slang
  extends: slang-fixer
  overlays:
    - buddy-monitor

slang-fixer:
  description: "Slang issue fixer — clone repo, write repro test, implement fix, verify, report. A/B test mode: no push, no PR."
  project: slang
  extends: slang-writer
  workflows:
    - fix-issue

slang-fixer-v2:
  description: "Slang issue fixer v2 — event-driven, re-entrant dispatch based on IKD state. Full lifecycle: ingest, reproduce, plan, implement, review, close. Pushes PRs."
  project: slang
  extends: slang-writer
  identity: container/spines/slang/identity/fix-agent.md
  invariants:
    - container/spines/slang/invariants/fix-github-policy.md
    - container/spines/slang/invariants/fix-git-policy.md
  context:
    - container/spines/slang/context/fix-vectored-review.md
  workflows:
    - issue-fix
    - issue-heartbeat
    - subproblem-fix
  skills:
    - ikd
    - issue-ingest
    - issue-reproduce
    - issue-plan
    - issue-implement
    - issue-close
    - subproblem-plan
    - subproblem-implement
    - subproblem-review
    - subproblem-close
    - review-plans
    - review-peel
    - review-repo-generic
    - review-repo-slang
  bindings:
    fix.issue: issue-fix
    fix.heartbeat: issue-heartbeat
    fix.subproblem: subproblem-fix
    review: review-plans
    review.plans: review-plans
    review.peel: review-peel
    review.repo: review-repo-generic
    review.repo.slang: review-repo-slang

slang-discord:
  description: "Slang Discord support — read user questions, research via DeepWiki + GitHub, draft verified answers, send to parent for review. Read-only, no posting."
  project: slang
  extends: slang-reader
  context:
    - container/spines/slang/context/discord-scope.md
  workflows:
    - discord-answer

slang-discord-critiqued:
  description: "Slang Discord support with answer-quality critique gate. Drafts pass codex review for factual accuracy before delivery."
  project: slang
  extends: slang-discord
  overlays:
    - discord-answer-critique

slang-discord-buddy:
  description: "Slang Discord support with real-time buddy monitor. Codex watches session and flags wrong assumptions mid-work."
  project: slang
  extends: slang-discord
  overlays:
    - buddy-monitor
