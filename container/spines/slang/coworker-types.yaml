slang-common:
  description: "You work on the Slang shading-language compiler (shader-slang/slang): its public ABI and the `.meta.slang` language surface are stable contracts you never break without maintainer approval."
  project: slang
  extends: base-common
  # Compose-time substitution values for shared workflow bodies (e.g. the base
  # triage-issue workflow, which slang-triage-issue extends). See CoworkerTypeEntry.vars.
  vars:
    repo: shader-slang/slang
    project: slang
    fixer: slang-fixer
    # The repo's actual PR labels; hard-coding `pr: breaking` (wrong name) in
    # fragments caused label failures, so every fragment reads these vars.
    labelNonBreaking: "pr: non-breaking"
    labelBreaking: "pr: breaking change"
  skill-source: shader-slang/slang-skills@main
  identity: container/spines/slang/identity/compiler-engineer.md
  invariants:
    - container/spines/slang/invariants/abi-stability.md
  context:
    - container/spines/slang/context/layout.md
    - container/spines/slang/context/bot-disclaimer.md
    # skill-discovery is moved to slang-writer's context — only writers/fixer
    # need to install new skills. Readers / triagers / reviewers don't.
  skills:
    - slang-build
    - slang-code-reader
    - slang-github
    - slang-github-webhook
  workflows: []
  mcpServers:
    deepwiki:
      type: http
      url: https://mcp.deepwiki.com/mcp
  bindings:
    repo: slang-github
    issues: slang-github
    ci: slang-github
    code: slang-code-reader
    doc: slang-code-reader
    test: slang-build
    critique: codex-critique

slang-reader:
  description: "You read, investigate and plan; you never edit code, push, or open PRs."
  project: slang
  extends: slang-common
  workflows:
    - slang-plan

slang-writer:
  description: "You plan and implement changes in a per-task worktree, with a failing test first, and ship them as draft PRs on `fix/issue-<number>` branches."
  project: slang
  extends: slang-common
  invariants:
    # Writer-only ABI/PR/commit rules. Inherited by slang-fixer.
    - container/spines/slang/invariants/code-changes.md
    # Code-comment discipline (add value, be concise, comment ≠ commit message).
    - container/spines/slang/invariants/comments.md
  context:
    # Pulled in here so writers/fixer can install additional skills, but
    # readers/triagers/reviewers don't pay for the registry instructions.
    - container/spines/slang/context/skill-discovery.md
  skills:
    - slang-code-writer
    - slang-docs
  workflows:
    - slang-plan
    - slang-implement
  bindings:
    code: slang-code-writer
    test: slang-build
    doc: slang-docs

slang-maintainer:
  description: "You run the recurring maintainer sweeps (daily report, release notes, issue prioritization) via /slang-maintain and deliver reports; you never push, open PRs or write to GitHub."
  project: slang
  extends: slang-reader
  invariants:
    - container/spines/slang/invariants/no-push.md
  skills:
    - slang-maintainer-tools
    - slang-pr-report
  workflows:
    - slang-maintain

slang-triage:
  description: "You triage Slang issues: research the code and docs, classify, write the solution brief, and always hand the chain to slang-fixer; you never edit code."
  project: slang
  extends: slang-reader
  workflows:
    - slang-triage-issue
  # Triage owns the diagnosis half of the chain — it inspects the issue,
  # classifies, names candidate approaches. OUTPUT_REVIEW is on the handoff
  # message itself. The fixer side carries PLAN/CODE/OUTPUT.
  required_critique_stages: [DIAGNOSIS_REVIEW, OUTPUT_REVIEW]

slang-fixer:
  description: "You fix triaged Slang issues: reproduce with a failing test, confirm the triage brief into a plan, fix in a per-issue worktree, verify, open a draft PR on `fix/issue-<number>`, get peer review, report. You never merge, mark ready-for-review, or push to protected branches."
  project: slang
  # Extends slang-common directly rather than slang-writer: a type cannot drop
  # inherited workflows, and the writer's generic /slang-plan + /slang-implement
  # (non-draft Ship step) conflicted with /slang-fix-issue, which is the fixer's
  # only workflow. The writer-side invariants, context, skills and bindings are
  # declared here explicitly.
  extends: slang-common
  invariants:
    - container/spines/slang/invariants/code-changes.md
    - container/spines/slang/invariants/comments.md
    # Always-in-context so it survives compaction (unlike the workflow step).
    - container/spines/slang/invariants/peer-review.md
    # Maintainer design direction is the acceptance criteria.
    - container/spines/slang/invariants/maintainer-direction.md
  context:
    - container/spines/slang/context/skill-discovery.md
  skills:
    - slang-code-writer
    - slang-docs
  workflows:
    - slang-fix-issue
  bindings:
    code: slang-code-writer
    test: slang-build
    doc: slang-docs
  # Fixer reads triage's diagnosis, commits to a plan, edits source, ships
  # a Fix Report. PLAN_REVIEW catches a bad approach before code is written;
  # CODE_REVIEW catches diff issues; OUTPUT_REVIEW vets the report itself.
  required_critique_stages: [PLAN_REVIEW, CODE_REVIEW, OUTPUT_REVIEW]

slang-reviewer:
  description: "You review Slang PRs, branches and patches with three reviewers (correctness, Devin, clarity) and deliver one combined report to the fixer; you post to GitHub only as a COMMENT-state review and only when the dispatch carries `<github-post-authorized />`."
  project: slang
  extends: slang-reader
  invariants:
    # Reviewers enforce code-change rules during PR review.
    - container/spines/slang/invariants/code-changes.md
    # Reviewers flag comment noise / commit-message prose leaking into source.
    - container/spines/slang/invariants/comments.md
    # Review-output rules — only loaded for slang-reviewer (not slang-fixer
    # or other writers, who don't post reviews).
    - container/spines/slang/invariants/review-output.md
    # Review against the maintainer's ask: a missed requirement is
    # REQUEST_CHANGES, never a nit.
    - container/spines/slang/invariants/spec-fidelity.md
  skills:
    - slang-pr-review-runner       # Reviewer A (correctness) + Reviewer B (Devin)
    - slang-clarity-review-runner  # Reviewer C (clarity) — local skill
  workflows:
    - slang-pr-review
  # Reviewer reads a diff, produces a verdict. CODE_REVIEW is the assessment
  # of the diff under review (codex independent-checks the assessment);
  # OUTPUT_REVIEW vets the final review verdict before sending.
  required_critique_stages: [CODE_REVIEW, OUTPUT_REVIEW]

slang-discord:
  description: "You answer Slang Discord questions by researching DeepWiki and GitHub and sending verified drafts to the parent for review; you never post directly."
  project: slang
  extends: slang-reader
  context:
    - container/spines/slang/context/discord-scope.md
  workflows:
    - slang-discord-answer
  # Answer-style work: codex reads question + sources + draft, verifies
  # factual accuracy, citations, continuation hygiene from the artifacts
  # themselves. OUTPUT_REVIEW subsumes the legacy ANSWER_REVIEW stage.
  required_critique_stages: [OUTPUT_REVIEW]

slang-pr-approver:
  description: "You turn an existing PR review (the posted bot reviews plus Devin) into one auditable shadow decision — WOULD_APPROVE, ABSTAIN or BLOCK — recorded in the ledger; you never write to GitHub."
  project: slang
  extends: slang-common
  skills:
    - slang-pr-approver
    - agent-browser            # Devin (app.devin.ai) via browser
    - slang-pr-review-runner   # for devin-fetch.sh (Devin scraper); never runs the reviewer
  workflows:
    - slang-pr-approve
  # Verity's terminal artifact is the approval decision, and its "delivery"
  # is internal-tier: the ledger append + the [Approval Decision] message.
  # Nothing leaves the system, but downstream automation trusts the ledger,
  # so it is gated like a boundary. DECISION_REVIEW independently vets the
  # derivation (clauses evaluated from data, verdict parse matches the review
  # doc); OUTPUT_REVIEW vets the ledger line + decision message themselves. The
  # marker is declared here (novel, project-level) so the composer unions it
  # into the shared vocabulary: the same token drives routing and gating —
  # dropping it to dodge the gate also drops the message from routing.
  required_critique_stages: [DECISION_REVIEW, OUTPUT_REVIEW]
  delivery_markers:
    - Approval Decision
