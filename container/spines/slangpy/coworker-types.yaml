slangpy-common:
  description: "SlangPy spine — identity, repo layout."
  project: slangpy
  extends: base-common
  # Compose-time substitution values for shared workflow bodies (e.g. the base
  # triage-issue workflow, which slangpy-triage-issue extends). See CoworkerTypeEntry.vars.
  vars:
    repo: shader-slang/slangpy
    project: slangpy
    fixer: slangpy-fixer
  skill-source: shader-slang/slang-skills@main
  identity: container/spines/slangpy/identity/engineer.md
  invariants: []
  context:
    - container/spines/slangpy/context/layout.md
    - container/spines/slangpy/context/bot-disclaimer.md
    # skill-discovery moved to slangpy-writer's context — only writers need
    # to install new skills; readers don't pay for the registry instructions.
  skills:
    - slangpy-build
    - slangpy-code-reader
    - slangpy-github
    - slang-github-webhook  # generic webhook handling; routes by repo to slangpy-* coworkers
  workflows: []
  mcpServers:
    deepwiki:
      type: http
      url: https://mcp.deepwiki.com/mcp
  bindings:
    repo: slangpy-github
    issues: slangpy-github
    code: slangpy-code-reader
    doc: slangpy-code-reader
    test: slangpy-build
    ci: slangpy-build
    critique: codex-critique

slangpy-reader:
  description: "Read-only SlangPy coworker — plan, investigate, review, research. Cannot edit code or create PRs."
  project: slangpy
  extends: slangpy-common
  workflows:
    - slangpy-plan

slangpy-writer:
  description: "Write-capable SlangPy coworker — plan + implement. Can edit code, write tests, create PRs."
  project: slangpy
  extends: slangpy-common
  invariants:
    # Writer-only code-style / PR / commit rules.
    - container/spines/slangpy/invariants/code-changes.md
    # Code-comment discipline (add value, be concise, comment ≠ commit message).
    - container/spines/slangpy/invariants/comments.md
  context:
    # Pulled in here so writers can install additional skills, but readers
    # don't pay for the registry instructions.
    - container/spines/slangpy/context/skill-discovery.md
  skills:
    - slangpy-code-writer
    - slangpy-docs
  workflows:
    - slangpy-plan
    - slangpy-implement
  bindings:
    code: slangpy-code-writer
    test: slangpy-build
    doc: slangpy-docs

slangpy-triage:
  description: "SlangPy issue triage — specialist first-line investigator. Read issue, fan out research (DeepWiki + local code + gh CLI), map solution space, hand off rich briefing to slangpy-fixer. Always forward; never drop the chain. Read-only."
  project: slangpy
  extends: slangpy-reader
  workflows:
    - slangpy-triage-issue
  required_critique_stages: [DIAGNOSIS_REVIEW, OUTPUT_REVIEW]

slangpy-fixer:
  description: "SlangPy issue fixer — clone repo, write repro test, implement fix, verify, report. A/B test mode: no push, no PR."
  project: slangpy
  extends: slangpy-writer
  invariants:
    # Always-in-context so it survives compaction (unlike the workflow step).
    # Unioned with the inherited slangpy-writer/slangpy-common invariants.
    - container/spines/slangpy/invariants/peer-review.md
  workflows:
    - slangpy-implement
  required_critique_stages: [PLAN_REVIEW, CODE_REVIEW, OUTPUT_REVIEW]

slangpy-reviewer:
  description: "SlangPy PR reviewer — correctness + clarity verdict on a PR / branch / patch via /slangpy-pr-review. Inherits slangpy-reader's investigation toolkit. Returns the review via send_file; posts back to GitHub as a COMMENT-state review ONLY when the dispatch carries the <github-post-authorized /> marker (a human tagged @nv-slang-bot)."
  project: slangpy
  extends: slangpy-reader
  invariants:
    # Reviewers enforce code-change rules during review.
    - container/spines/slangpy/invariants/code-changes.md
    # Reviewers flag comment noise / commit-message prose leaking into source.
    - container/spines/slangpy/invariants/comments.md
    # Review-output rules — only loaded for slangpy-reviewer (not the fixer or
    # other writers, who don't post reviews).
    - container/spines/slangpy/invariants/review-output.md
  workflows:
    - slangpy-pr-review
  required_critique_stages: [CODE_REVIEW, OUTPUT_REVIEW]

slangpy-pr-approver:
  description: "Approval-decision coworker — turns a PR review into one auditable decision each (WOULD_APPROVE | ABSTAIN | BLOCK), critique-gated, shadow-mode. Builds its own review input: harvests the bot review already posted on the PR (github-actions[bot] = production claude-code-action; coderabbitai[bot]) and runs Devin, then decides from it. Inherits slangpy-common (repo context, deepwiki, slangpy-github reads, codex-critique binding); agent-browser + slang-pr-review-runner give it Devin. Writing to GitHub is forbidden by invariant and gate."
  project: slangpy
  extends: slangpy-common
  skills:
    - slangpy-pr-approver
    - agent-browser            # Devin (app.devin.ai) via browser
    - slang-pr-review-runner   # for devin-fetch.sh (Devin scraper); never runs the reviewer
  workflows:
    - slangpy-pr-approve
  # The terminal artifact is the approval decision; its "delivery" is
  # internal-tier: the ledger append + the [Approval Decision] message.
  # Nothing leaves the system, but downstream automation trusts the ledger, so
  # it is gated like a boundary. DECISION_REVIEW independently vets the
  # derivation (clauses evaluated from data, verdict parse matches the review
  # doc); OUTPUT_REVIEW vets the ledger line + decision message themselves. The
  # marker is declared here (project-level) so the composer unions it into the
  # shared vocabulary: the same token drives routing and gating — dropping it
  # to dodge the gate also drops the message from routing.
  required_critique_stages: [DECISION_REVIEW, OUTPUT_REVIEW]
  delivery_markers:
    - Approval Decision
