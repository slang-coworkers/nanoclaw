slangpy-common:
  description: "SlangPy spine: the identity and repository layout every SlangPy coworker shares."
  project: slangpy
  extends: base-common
  # Compose-time substitution values for shared workflow bodies (e.g. the base
  # triage-issue workflow, which slangpy-triage-issue extends). See CoworkerTypeEntry.vars.
  vars:
    repo: shader-slang/slangpy
    project: slangpy
    fixer: slangpy-fixer
  skill-source: shader-slang/slang-skills@main
  identity: container/spines/slangpy/identity/engineer.md
  invariants: []
  context:
    - container/spines/slangpy/context/layout.md
    - container/spines/slangpy/context/bot-disclaimer.md
  skills:
    - slangpy-build
    - slangpy-code-reader
    - slangpy-github
    - slang-github-webhook  # generic webhook handling; routes by repo to slangpy-* coworkers
  workflows: []
  mcpServers:
    deepwiki:
      type: http
      url: https://mcp.deepwiki.com/mcp
  bindings:
    repo: slangpy-github
    issues: slangpy-github
    code: slangpy-code-reader
    doc: slangpy-code-reader
    test: slangpy-build
    ci: slangpy-build
    critique: codex-critique

slangpy-reader:
  description: "Read-only SlangPy coworker that plans, investigates, reviews and researches. It never edits code or opens PRs."
  project: slangpy
  extends: slangpy-common
  workflows:
    - slangpy-plan

slangpy-writer:
  description: "Write-capable SlangPy coworker that plans and implements: edits code, writes tests, opens draft PRs. It never merges or marks a PR ready for review."
  project: slangpy
  extends: slangpy-common
  invariants:
    # Writer-only code-style / PR / commit rules.
    - container/spines/slangpy/invariants/code-changes.md
    # Code-comment discipline (add value, be concise, comment ≠ commit message).
    - container/spines/slangpy/invariants/comments.md
  context:
    # Only writers install additional skills, so readers don't pay for the
    # registry instructions.
    - container/spines/slangpy/context/skill-discovery.md
  skills:
    - slangpy-code-writer
    - slangpy-docs
  workflows:
    - slangpy-plan
    - slangpy-implement
  bindings:
    code: slangpy-code-writer
    test: slangpy-build
    doc: slangpy-docs

slangpy-triage:
  description: "Read-only first-line investigator for SlangPy issues: reads the issue, researches it (local code, DeepWiki, gh CLI), maps the solution space and hands slangpy-fixer a briefing. It never edits code; its only GitHub write is its own triage comment."
  project: slangpy
  extends: slangpy-reader
  workflows:
    - slangpy-triage-issue
  required_critique_stages: [DIAGNOSIS_REVIEW, OUTPUT_REVIEW]

slangpy-fixer:
  description: "Fixes a triaged SlangPy issue end to end: repro test, fix, verify, draft PR with explanation comment, peer review, report. It never merges, marks a PR ready for review, or pushes to protected branches."
  project: slangpy
  extends: slangpy-writer
  invariants:
    # Always-in-context so it survives compaction (unlike the workflow step).
    # Unioned with the inherited slangpy-writer/slangpy-common invariants.
    - container/spines/slangpy/invariants/peer-review.md
  workflows:
    - slangpy-implement
  required_critique_stages: [PLAN_REVIEW, CODE_REVIEW, OUTPUT_REVIEW]

slangpy-reviewer:
  description: "Reviews a SlangPy PR, branch or patch for correctness and clarity via /slangpy-pr-review and returns the verdict through send_file. It never approves or requests changes on GitHub, and posts there only when the dispatch carries the <github-post-authorized /> marker."
  project: slangpy
  extends: slangpy-reader
  invariants:
    # Reviewers enforce code-change rules during review.
    - container/spines/slangpy/invariants/code-changes.md
    # Reviewers flag comment noise / commit-message prose leaking into source.
    - container/spines/slangpy/invariants/comments.md
    # Review-output rules — only loaded for slangpy-reviewer (not the fixer or
    # other writers, who don't post reviews).
    - container/spines/slangpy/invariants/review-output.md
  workflows:
    - slangpy-pr-review
  required_critique_stages: [CODE_REVIEW, OUTPUT_REVIEW]

slangpy-pr-approver:
  description: "Turns the bot reviews already on a PR (github-actions[bot], coderabbitai[bot]) plus its own Devin run into one auditable, critique-gated decision — WOULD_APPROVE, ABSTAIN or BLOCK — in shadow mode. It never writes to GitHub."
  project: slangpy
  extends: slangpy-common
  skills:
    - slangpy-pr-approver
    - agent-browser            # Devin (app.devin.ai) via browser
    - slang-pr-review-runner   # for devin-fetch.sh (Devin scraper); never runs the reviewer
  workflows:
    - slangpy-pr-approve
  # The terminal artifact is the approval decision; its "delivery" is
  # internal-tier: the ledger append + the [Approval Decision] message.
  # Nothing leaves the system, but downstream automation trusts the ledger, so
  # it is gated like a boundary. DECISION_REVIEW independently vets the
  # derivation (clauses evaluated from data, verdict parse matches the review
  # doc); OUTPUT_REVIEW vets the ledger line + decision message themselves. The
  # marker is declared here (project-level) so the composer unions it into the
  # shared vocabulary: the same token drives routing and gating — dropping it
  # to dodge the gate also drops the message from routing.
  required_critique_stages: [DECISION_REVIEW, OUTPUT_REVIEW]
  delivery_markers:
    - Approval Decision
