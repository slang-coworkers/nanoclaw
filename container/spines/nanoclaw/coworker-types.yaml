nanoclaw-common:
  description: "NanoClaw platform spine — identity, contribution invariants, repo layout."
  project: nanoclaw
  extends: base-common
  identity: container/spines/nanoclaw/identity/engineer.md
  invariants:
    - container/spines/nanoclaw/invariants/public-api.md
  context:
    - container/spines/nanoclaw/context/layout.md
  skills:
    - nanoclaw-build
    - nanoclaw-code-reader
    - nanoclaw-github
  workflows: []
  mcpServers:
    deepwiki:
      type: http
      url: https://mcp.deepwiki.com/mcp
  bindings:
    repo: nanoclaw-github
    issues: nanoclaw-github
    code: nanoclaw-code-reader
    doc: nanoclaw-code-reader
    test: nanoclaw-build
    critique: codex-critique

nanoclaw-reader:
  description: "Read-only NanoClaw coworker — plan, investigate, review, research. Cannot edit code or create PRs."
  project: nanoclaw
  extends: nanoclaw-common
  workflows:
    - nanoclaw-plan

nanoclaw-writer:
  description: "Write-capable NanoClaw coworker — plan + implement. Can edit code, write tests, create PRs."
  project: nanoclaw
  extends: nanoclaw-common
  invariants:
    # Code-change rules apply when authoring; readers don't carry these.
    - container/spines/nanoclaw/invariants/code-changes.md
  skills:
    - nanoclaw-code-writer
    - nanoclaw-docs
  workflows:
    - nanoclaw-plan
    - nanoclaw-implement
  overlays: [chain-routing-gate, critique-gate]
  required_critique_stages: [PLAN_REVIEW, CODE_REVIEW, OUTPUT_REVIEW]
  bindings:
    code: nanoclaw-code-writer
    test: nanoclaw-build
    doc: nanoclaw-docs

nanoclaw-reviewer:
  description: "NanoClaw PR reviewer — drives Devin Review (app.devin.ai/review) via agent-browser against a slang-coworkers/nanoclaw PR. Read-only: returns devin-flags.md to the caller via send_file. No GitHub posting, no Reviewer-A pipeline (Devin only)."
  project: nanoclaw
  extends: nanoclaw-reader
  invariants:
    # Reviewers enforce the code-change rules during PR review.
    - container/spines/nanoclaw/invariants/code-changes.md
  skills:
    - nanoclaw-pr-review-runner
  workflows:
    - nanoclaw-pr-review
  overlays: [chain-routing-gate, critique-gate]
  required_critique_stages: [CODE_REVIEW, OUTPUT_REVIEW]
