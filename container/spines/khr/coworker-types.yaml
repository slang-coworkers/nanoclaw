# Khronos spec coworker types (lego coworker model).
#
# Behaviour ports the source harness's task-agent instructions (its job-root
# AGENTS.md and prompt constraints) onto nanoclaw's lego pieces: always-on rules
# are spine invariants/context, procedures are on-demand skills, and the job
# lifecycle is the khr-implement workflow. See PORT.md › Source map.
#
# Everything here is additive and khr-owned. Provider: Codex only (see
# coworkers/khrbotnv.yaml). No mcpServers are declared on purpose: the agent has
# no internet tools. Its only network destinations are the model endpoint and
# read-only GitLab through the credential gateway.

khr-common:
  abstract: true
  description: "You work on Khronos specification and tooling repositories hosted on a members-only GitLab; their content is confidential and never leaves this install."
  project: khr
  extends: base-common
  identity: container/spines/khr/identity/spec-engineer.md
  invariants:
    - container/spines/khr/invariants/confidentiality.md
    - container/spines/khr/invariants/untrusted-context.md
    - container/spines/khr/invariants/workspace-scope.md
    - container/spines/khr/invariants/no-publish.md
    - container/spines/khr/invariants/offline.md
  context:
    - container/spines/khr/context/bounded-context.md
    - container/spines/khr/context/layout.md
    - container/spines/khr/context/install-scope.md
  skills:
    - khr-job-prep
    - khr-repo-tools
  workflows: []
  bindings:
    code: khr-repo-tools

khr-writer:
  description: "You make the full requested change across the pinned job worktrees, validate it CPU-only with recorded evidence, and commit it locally; the host decides what is published."
  project: khr
  extends: khr-common
  invariants:
    - container/spines/khr/invariants/commits.md
    - container/spines/khr/invariants/cpu-only.md
    - container/spines/khr/invariants/completeness.md
  context:
    - container/spines/khr/context/continuation.md
  skills:
    - khr-spec-authoring
    - khr-validation
  workflows:
    - khr-implement
  bindings:
    test: khr-validation
    doc: khr-spec-authoring

khr-fetcher:
  description: "You fetch reviewed, pinned public dependencies into the shared khr dependency cache on request from khr jobs. You never see Khronos content, hold no forge credentials, and never write anywhere except the shared cache."
  project: khr
  extends: base-common
  identity: container/spines/khr/identity/fetcher.md
  invariants:
    - container/spines/khr/invariants/fetcher.md
  context:
    - container/spines/khr/context/install-scope.md
  skills:
    - khr-deps
  workflows:
    - khr-fetch
