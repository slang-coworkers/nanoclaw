# Grafana unified-alerting provisioning for the NanoClaw host (Grafana 13, file provisioning).
# Deployed to /etc/grafana/provisioning/alerting/nanoclaw-alerts.yaml; Grafana reads it at start (and on
# `systemctl restart grafana-server`). Every rule reads the `nanoclaw_host` measurement written by
# ops/metrics/nanoclaw-metrics.py every 60 s. Thresholds come from the 2026-09-26 outage
# (reports/prod-outage-2026-09-26-postmortem.html): each rule would have fired hours before a human noticed.
#
# Notifications: the `nanoclaw-ops` contact point below is a Slack incoming webhook read from the
# environment variable NANOCLAW_ALERT_SLACK_WEBHOOK (set it in /etc/default/grafana-server, then restart
# Grafana). Until it is set, rules still evaluate and show as Firing on the dashboard's
# "Firing NanoClaw alerts" panel and under Alerting → Alert rules.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: nanoclaw-ops
    receivers:
      - uid: nanoclaw-ops-slack
        type: slack
        settings:
          url: ${NANOCLAW_ALERT_SLACK_WEBHOOK}
          title: '{{ template "default.title" . }}'
          text: '{{ template "default.message" . }}'
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: nanoclaw-ops
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: nanoclaw-ops
        object_matchers:
          - ['team', '=', 'nanoclaw']

groups:
  - orgId: 1
    name: nanoclaw-host
    folder: NanoClaw
    interval: 1m
    rules:
      # --- host process -----------------------------------------------------------------------------
      - uid: nc-host-down
        title: NanoClaw host down
        condition: C
        for: 2m
        labels: { team: nanoclaw, severity: critical }
        annotations:
          summary: The host process is not running (no live pidfile) for 2 minutes.
          runbook: Check `systemctl --user status nanoclaw`, logs/nanoclaw.error.log for FATAL / tripwire / circuit breaker. 09-26: heap OOM crash loop; 09-28: empty gateway registration.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT last("host_up") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }
      - uid: nc-crash-loop
        title: NanoClaw crash loop (circuit breaker armed)
        condition: C
        for: 1m
        labels: { team: nanoclaw, severity: critical }
        annotations:
          summary: data/circuit-breaker.json shows repeated failed startups (attempt {{ $values.B }}).
          runbook: The host dies on every start. Read the FATAL line in logs/nanoclaw.error.log; if it names a cli_request, #1733 should have quarantined it; if "No gateway provider", installed.ts lost its onecli import.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT last("breaker_attempt") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
      - uid: nc-host-restarts
        title: NanoClaw host restarted more than twice in an hour
        condition: C
        for: 0s
        labels: { team: nanoclaw, severity: warning }
        annotations:
          summary: '{{ $values.B }} host restarts in the last hour.'
          runbook: One restart is a deploy. Several in an hour is a crash loop that the breaker has not caught yet, or a deploy gone wrong.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT sum("host_restart") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: sum, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [2] } } ] }
      # --- event loop / sweep --------------------------------------------------------------------------
      - uid: nc-sweep-slow
        title: NanoClaw sweep tick over 10 s for 5 minutes
        condition: C
        for: 5m
        labels: { team: nanoclaw, severity: warning }
        annotations:
          summary: 'Sweep tick {{ $values.B }} ms — the event loop is doing seconds of synchronous work per minute.'
          runbook: Healthy is 1-3 s (the first tick after a restart is ~20 s and is excluded by the 5 m hold). Look for a session whose mailbox reads are unbounded (strace the host, see the post-mortem §4b).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT last("sweep_tick_ms") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [10000] } } ] }
      - uid: nc-sweep-stale
        title: NanoClaw sweep stopped ticking
        condition: C
        for: 5m
        labels: { team: nanoclaw, severity: critical }
        annotations:
          summary: No "Sweep tick" log line in 5 minutes while the host is up — the event loop is frozen or the sweep is stuck.
          runbook: 09-27 08:00-11:27Z looked exactly like this between ticks (40-60 s gaps, then whole ticks missing). Capture a CPU profile (SIGUSR1 + inspector) before restarting.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT sum("sweep_ticks") FROM "nanoclaw_host" WHERE $timeFilter GROUP BY time(1m) fill(0)' }
          - refId: D
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: D, rawQuery: true, resultFormat: time_series, query: 'SELECT last("host_up") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: E
            datasourceUid: __expr__
            model: { refId: E, type: reduce, expression: D, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: '$B < 1 && $E > 0' }
      # --- spawns ----------------------------------------------------------------------------------------
      - uid: nc-wake-failures
        title: NanoClaw container wakes failing
        condition: C
        for: 5m
        labels: { team: nanoclaw, severity: critical }
        annotations:
          summary: '{{ $values.B }} wakeContainer failures per minute for 5 minutes — new work cannot start.'
          runbook: 09-27 this was 288-506 per 6 min with OneCLI "aborted due to timeout" — OneCLI was fine, the event loop was frozen. Check sweep tick first; then docker; then OneCLI :10254.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT last("wake_failed") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
      - uid: nc-quarantined
        title: NanoClaw quarantined a system action
        condition: C
        for: 0s
        labels: { team: nanoclaw, severity: warning }
        annotations:
          summary: A cli_request was started twice without completing (the host died running it) and has been parked (#1733).
          runbook: Find "System action quarantined" in logs/nanoclaw.error.log; the request id and session are in the line. The agent got an error frame; nothing replays it.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT sum("quarantined") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: sum, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
      # --- webhooks ----------------------------------------------------------------------------------------
      - uid: nc-webhook-port
        title: NanoClaw GitHub webhook listener down
        condition: C
        for: 2m
        labels: { team: nanoclaw, severity: critical }
        annotations:
          summary: Port 3841 not accepting connections for 2 minutes — GitHub deliveries are failing (GitHub does not retry).
          runbook: Once the host is back, replay from the App delivery log (python3 /tmp/prod-deploy/gh-redeliver.py) and check webhook_inbox.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT last("webhook_port") FROM "nanoclaw_health" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }
      - uid: nc-inbox-parked
        title: NanoClaw webhook inbox has parked deliveries
        condition: C
        for: 0s
        labels: { team: nanoclaw, severity: warning }
        annotations:
          summary: '{{ $values.B }} GitHub deliveries exhausted their replay budget and need an operator.'
          runbook: 'pnpm exec tsx scripts/q.ts data/v2.db "SELECT delivery_id, event_type, last_error FROM webhook_inbox WHERE status=''failed'' AND next_attempt_at IS NULL"; fix the cause, then redeliver from GitHub.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT last("inbox_parked") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }
      # --- growth ------------------------------------------------------------------------------------------
      - uid: nc-mailbox-huge
        title: NanoClaw session mailbox over 1 GB
        condition: C
        for: 10m
        labels: { team: nanoclaw, severity: warning }
        annotations:
          summary: 'Largest session DB is {{ $values.B }} bytes. Latency no longer depends on it, disk does.'
          runbook: 'See nanoclaw_host_mailbox for the session. Nothing prunes by age unless an operator sets NANOCLAW_MAILBOX_RETENTION_DAYS (system frames only, never conversation).'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT last("mailbox_bytes_max") FROM "nanoclaw_host" WHERE $timeFilter' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [1073741824] } } ] }
      - uid: nc-collector-stale
        title: NanoClaw metrics collector not reporting
        condition: C
        for: 5m
        labels: { team: nanoclaw, severity: warning }
        annotations:
          summary: No nanoclaw_collector point in 5 minutes — every other rule here is blind.
          runbook: 'systemctl status nanoclaw-metrics.timer; journalctl -u nanoclaw-metrics -n 20; /tmp/nanoclaw-metrics.collector.err'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PF3A0F3054C0DA367
            model: { refId: A, rawQuery: true, resultFormat: time_series, query: 'SELECT count("points") FROM "nanoclaw_collector" WHERE time > now() - 5m' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }
