version: 3
mode: standard
requires:
  coworkerTypes:
    - khr-writer
    - khr-common
    - base-common
agent:
  name: khrbotnv
  folder: khrbotnv
  routing: direct
  coworkerType: khr-writer
  allowedMcpTools: null
